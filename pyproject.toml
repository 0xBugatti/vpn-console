[project]
name = "vpn-console"
version = "0.1.0"
description = "Unified internal VPN management console: OpenVPN profile library, Tailscale admin, local node control"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=43.0",
    "segno>=1.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
