# vpn-console on the tailscaled host (research D2/D12).
#
#   cd deploy && docker compose up -d --build
#
# network_mode: host — no port mapping applies; uvicorn binds
# VPNCONSOLE_BIND:VPNCONSOLE_PORT directly on the host. The default bind is
# 127.0.0.1 (local only): reach it through an SSH tunnel
#   ssh -N -L 8091:localhost:8091 root@<server>
# Set VPNCONSOLE_BIND=0.0.0.0 in .env only if you deliberately want it on
# every interface (do NOT funnel it).
name: vpn-console

services:
  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: vpn-console:latest
    restart: unless-stopped
    network_mode: host
    # Root on THIS host: tailscaled's localapi 403s non-root peers, and
    # /run/systemd/private is root-only. For hosts with relaxed socket
    # perms, drop this line to run as the image's non-root `console` user.
    user: "0:0"
    # systemd's PID 1 admits systemctl clients by cgroup membership — a
    # container cgroup looks foreign and gets ENODATA. pid+cgroup on the
    # host also gives the listening-ports card real process names.
    pid: "host"
    cgroup: host
    command: >
      uvicorn server.app:app --host ${VPNCONSOLE_BIND:-127.0.0.1} --port ${VPNCONSOLE_PORT:-8090}
    environment:
      # Required — compose refuses to start without it (fail loud, not quietly).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in deploy/.env (or mount ADMIN_PASSWORD_FILE)}
      # Optional — when set it wins over any token stored via Settings.
      TS_API_TOKEN: ${TS_API_TOKEN:-}
      TS_TAILNET: ${TS_TAILNET:--}
      # System-scan (Profiles → Scan system): which read-only mounts to walk.
      VPNCONSOLE_SCAN_DIRS: ${VPNCONSOLE_SCAN_DIRS:-/scan/openvpn,/scan/home,/scan/root}
      # optional login link token (>= 24 chars); prefer creating one in Settings
      VPNCONSOLE_LOGIN_TOKEN: ${VPNCONSOLE_LOGIN_TOKEN:-}
      # Optional — pin session signing across restarts (otherwise regenerated).
      VPNCONSOLE_SESSION_SECRET: ${VPNCONSOLE_SESSION_SECRET:-}
      VPNCONSOLE_PORT: ${VPNCONSOLE_PORT:-8090}
    volumes:
      # Local tailscaled control (read-write: connect/serve/funnel need it).
      # Newer Tailscale units use /run/tailscale/tailscaled.sock — override
      # TAILSCALE_SOCKET in .env if yours differs from the classic default.
      - ${TAILSCALE_SOCKET:-/var/run/tailscale/tailscaled.socket}:/var/run/tailscale/tailscaled.socket
      # Host unit control + logs (research D2 — bind mounts, no privileges).
      - /run/systemd/private:/run/systemd/private
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # systemctl's sd_booted() checks this dir; journalctl needs the host
      # machine-id to find the right journal store.
      - /run/systemd/system:/run/systemd/system:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      # System-scan inputs (read-only!): the usual OpenVPN config locations on
      # the host. Trim these on other machines and adjust VPNCONSOLE_SCAN_DIRS
      # to match — the Profiles page "Scan system" feature only ever reads.
      - /etc/openvpn:/scan/openvpn:ro
      - /home:/scan/home:ro
      - /root:/scan/root:ro
      # SQLite DB + plain .ovpn store — the only state that must survive.
      - data:/data

volumes:
  data:
